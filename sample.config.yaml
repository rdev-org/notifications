server:
  host: "localhost"
  port: "50051"
  env: "dev"

database:
  url: "postgres://postgres:postgres@localhost:5432/ecom?sslmode=disable"
  max_open_conns: 10
  max_idle_conns: 5
  debug: false

redis: "localhost:6379"

smtp:
  host: "localhost"
  port: "1025"
  from: "no-reply@test.local"
  user: "no-reply@test.local"
  pass: "password-here"

jwt_secret_key: "secret_key"

aws:
  region: "ap-southeast-1"
  bucket: "test-bucket"

kafka:
  brokers:
    - "localhost:9092"
  topic: "notification-emails"
  group_id: "email-workers"
